<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koma 測試</title>
<style>
body{font:14px/1.6 ui-monospace,Menlo,monospace;margin:16px;background:#fafaf8;color:#2b2d2f}
.fail{color:#a33}.pass{color:#3a7}pre{white-space:pre-wrap}iframe{display:none}#phone{display:block;position:absolute;left:-9999px;top:0;border:0}
@media (prefers-color-scheme:dark){body{background:#19191a;color:#e0dfdb}}
</style>
</head>
<body>
<h1 id="sum">執行中…</h1>
<pre id="out"></pre>
<iframe id="app" src="../index.html?test"></iframe>
<iframe id="phone" width="390" height="700" src="../index.html?test"></iframe>
<script>
/* Runs the real page in an iframe with ?test, which keeps it away from saved drafts. */
const frame=document.getElementById("app");
const results=[];
frame.onload=async()=>{
  const w=frame.contentWindow,k=code=>w.eval(code);
  await new Promise(r=>setTimeout(r,50));
  const T=(name,fn)=>{let ok=false,info="";try{const r=fn();ok=r===true;if(!ok)info=JSON.stringify(r)}catch(e){info=String(e)}results.push({name,ok,info})};
  const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b)||{got:a,want:b};
  const reset=()=>k("load(SAMPLE);prevDrafts=[];savePrevs()");
  const cuts=()=>k("doc.clips.map(c=>[c.in,c.out])");

  T("修剪入點，後面鏡頭順移",()=>{reset();k("sel={kind:'clip',id:'c1'};nudgeClip('in',3)");return eq(k("layout(doc).map.c2.start"),69)});
  T("裁入點時標記留在同一個素材格",()=>{reset();k("doc.markers[1].at=30;sel={kind:'clip',id:'c3'};nudgeClip('in',10)");return eq(k("doc.markers[1].at"),20)});
  T("復原修剪，再重做",()=>{reset();k("sel={kind:'clip',id:'c1'};nudgeClip('out',-1);doUndo()");const a=k("doc.clips[0].out");k("doRedo()");return eq([a,k("doc.clips[0].out")],[117,116])});
  T("備註有自己的復原紀錄，不會連帶遺失",()=>{reset();k(`sel={kind:'clip',id:'c1'};nudgeClip('out',-1);
    sel={kind:'clip',id:'c1'};renderInspector();const a=$('#clipNote');a.value='冷一點';a.dispatchEvent(new Event('input'));a.blur();doUndo()`);
    return eq(k("[doc.clips[0].note,doc.clips[0].out]"),["",116])});
  T("清空備註會出現在修改清單",()=>{reset();k("doc.markers[0].note=''");return String(k("changes().map(c=>c.t).join()")).includes("清除原有說明")||"missing"});
  T("裁短鏡頭：提示詞與 JSON 的標記位置一致",()=>{reset();k("sel={kind:'clip',id:'c3'};nudgeClip('out',-50)");
    const at=k("exportDoc().markers.find(m=>m.id==='m2').at");const log=k("changes().map(c=>c.t).join()");return (at===21&&log.includes("第 21 格"))||{at,log}});
  T("載入新時間軸會保留上一份草稿",()=>{reset();k("sel={kind:'clip',id:'c1'};nudgeClip('out',-1);loadNew(SAMPLE)");
    const a=k("doc.clips[0].out");k("restorePrev()");return eq([a,k("doc.clips[0].out")],[117,116])});
  T("非整數幀率的 FCPXML 時間值都是整數分子",()=>{
    for(const f of [23.976,29.97,59.94]){k(`load({...SAMPLE,fps:${f}})`);const x=k("buildFCPXML()");
      const bad=[...x.matchAll(/="([\d.]+)\/\d+s"/g)].filter(m=>m[1].includes("."));if(bad.length)return bad[0][0]}
    return true});
  T("靜態圖不宣告音訊",()=>{reset();return /title_card[^>]*hasAudio/.test(k("buildFCPXML()"))?"has audio":true});
  T("特殊字元檔名會編碼",()=>{reset();k("doc.clips[0].src='a#b?c d.mov'");return k("buildFCPXML()").includes("a%23b%3Fc%20d.mov")||"not encoded"});
  T("FCPXML 來回：剪接點一致",()=>{reset();k("sel={kind:'clip',id:'c2'};nudgeClip('in',3)");const c=cuts();return eq(k("parseFCPXML(buildFCPXML()).data.clips.map(c=>[c.in,c.out])"),c)});
  T("EDL 來回：剪接點一致",()=>{reset();k("sel={kind:'clip',id:'c2'};nudgeClip('out',-4)");const c=cuts();return eq(k("parseEDL(buildEDL(),30).clips.map(c=>[c.in,c.out])"),c)});
  T("EDL 掉格：01:00:00;00 是 107892 格",()=>eq(k("tcToF('01:00:00;00',30)"),107892));
  T("EDL 掉格：第 10 分鐘不扣格",()=>eq(k("tcToF('00:10:00;00',30)"),17982));
  T("EDL 掉格但幀率選錯會拒絕",()=>{try{k("parseEDL('TITLE: x\\nFCM: DROP FRAME\\n',30)");return "no error"}catch(e){return e.message.includes("29.97")||e.message}});
  T("EDL 空白會提出警告",()=>{const r=k(`parseEDL('001 AX V C 00:00:00:00 00:00:01:00 01:00:00:00 01:00:01:00\\n002 AX V C 00:00:00:00 00:00:01:00 01:00:02:00 01:00:03:00\\n',30).warn`);return String(r).includes("空白")||r});
  T("拒絕無限大 fps",()=>{try{k("normalize({fps:1e309,clips:[{in:0,out:9}]})");return "accepted"}catch(e){return true}});
  T("拒絕超大格數",()=>{try{k("normalize({clips:[{in:0,out:1e300}]})");return "accepted"}catch(e){return true}});
  T("重複 id 會變成唯一",()=>{const ids=k("normalize({clips:[{id:'a',out:1},{id:'a_1',out:1},{id:'a',out:1},{id:'a',out:1}]}).clips.map(c=>c.id)");return new Set(ids).size===4||ids});
  T("id 為 __proto__ 不會壞",()=>{k("load({clips:[{id:'__proto__',in:0,out:5}]})");return eq(k("total()"),5)});
  T("對不到鏡頭的標記會略過並提出",()=>{const n=k("normalize({clips:[{id:'a',out:5}],markers:[{clip:'x'}]}).markers.length");return n===0&&String(k("normWarn")).includes("特效")||{n}});
  T("標題中的 HTML 不會執行",()=>{k(`load({clips:[{name:'<img src=x onerror=window.pwn=1>',in:0,out:5}]});sel={kind:'clip',id:'c1'};renderAll()`);return !k("document.querySelector('#trV img,#insp img')")});
  T("連續換三份時間軸，三份草稿都能還原",()=>{reset();
    for(const n of [116,115,114]){k(`sel={kind:'clip',id:'c1'};doc.clips[0].out=${n};loadNew(SAMPLE)`)}
    const got=[];for(let i=0;i<3;i++){k("restorePrev()");got.push(k("doc.clips[0].out"))}return eq(got,[114,115,116])});
  T("超長時間軸會被拒絕，不會卡死",()=>{try{k("normalize({clips:[{in:0,out:1000000000}]})");return "accepted"}catch(e){return true}});
  T("上限內的長時間軸刻度數有界",()=>{k("load({clips:[{in:0,out:2000000}]});ppf=48;renderTimeline()");return k("document.querySelectorAll('.tick').length")<=1001||k("document.querySelectorAll('.tick').length")});
  T("修改清單附上鏡頭 id 與素材檔名",()=>{reset();k("sel={kind:'clip',id:'c2'};nudgeClip('in',1)");return k("changes()[0].t").includes("[c2 / IMG_2043.MOV]")||k("changes()[0].t")});
  T("延長超過 srcDuration 會警告",()=>{k("load({clips:[{id:'a',in:0,out:10,srcDuration:12}]});sel={kind:'clip',id:'a'};nudgeClip('out',5)");return k("changes()[0].t").includes("超出素材長度 3 格")||k("changes()[0].t")});
  T("手動清單由後往前排，修剪在前特效在後",()=>{reset();k("sel={kind:'clip',id:'c1'};nudgeClip('in',2);sel={kind:'clip',id:'c5'};nudgeClip('out',-3)");const x=k("buildManual()");
    return (x.indexOf("鏡頭 05")<x.indexOf("鏡頭 01")&&x.indexOf("結尾裁掉 3 格")>0&&x.indexOf("開頭裁掉 2 格")>0&&x.indexOf("二、加上特效")>x.indexOf("鏡頭 01"))||x});
  T("給 Claude 的指令不再要求手算壓縮",()=>{const x=k("$('#askSnip').textContent");return (!x.includes("deflate")&&x.includes("成片幀率"))||x});
  T("介面沒有日文假名",()=>{const x=k("document.body.textContent");return !/[\u3040-\u30ff]/.test(x)||x.match(/[\u3040-\u30ff]+/)[0]});
  T("備份失敗時拒絕載入，草稿不被取代",()=>{reset();k("sel={kind:'clip',id:'c1'};nudgeClip('out',-1);window.__set=store.set;store.set=(v,key)=>key===PREV?false:window.__set(v,key)");
    let msg="";try{k("loadNew({clips:[{id:'z',out:9}]})")}catch(e){msg=e.message}k("store.set=window.__set");return (msg.includes("空間不足")&&k("doc.clips[0].out")===116&&k("prevDrafts.length")===0)||{msg}});
  T("還原時備份失敗，不交換草稿",()=>{reset();k("sel={kind:'clip',id:'c1'};nudgeClip('out',-1);loadNew({clips:[{id:'z',out:9}]});sel={kind:'clip',id:'z'};nudgeClip('out',-1);window.__set=store.set;store.set=(v,key)=>key===PREV?false:window.__set(v,key);restorePrev();store.set=window.__set");
    return (k("doc.clips[0].id")==="z"&&k("doc.clips[0].out")===8&&k("prevDrafts.length")===1)||k("[doc.clips[0].id,prevDrafts.length]")});
  T("無效草稿不會造成 orig 與 doc 不一致",()=>{reset();const before=k("orig.clips[0].id");try{k("load({clips:[{id:'q',out:9}]},{clips:[{in:0,out:1e300}]})")}catch(e){}return eq(k("[orig.clips[0].id,doc.clips[0].id]"),[before,before])});
  T("編輯不會超過可重新載入的上限",()=>{k("load({clips:[{id:'a',out:2000000}]});sel={kind:'clip',id:'a'};nudgeClip('out',5)");return eq(k("doc.clips[0].out"),2000000)});
  T("入點來回調整：標記依規則留在邊界",()=>{k("load({clips:[{id:'a',in:12,out:84}],markers:[{id:'m',clip:'a',at:30}]});sel={kind:'clip',id:'a'};nudgeClip('in',35)");const a=k("doc.markers[0].at");k("nudgeClip('in',-35)");return eq([a,k("doc.markers[0].at")],[0,35])});
  T("裁短後資料層立即一致，JSON 往返續編結果相同",()=>{k("load({clips:[{id:'a',in:12,out:84}],markers:[{id:'m',clip:'a',at:30}]});sel={kind:'clip',id:'a'};nudgeClip('out',-50)");
    const live=k("doc.markers[0].at"),json=k("JSON.stringify(exportDoc())");k("nudgeClip('out',50)");const a=k("doc.markers[0].at");
    k(`load(${json});sel={kind:'clip',id:'a'};nudgeClip('out',50)`);return eq([live,a,k("doc.markers[0].at")],[21,21,21])});
  T("沒有改到數值的操作不清除重做",()=>{k("load({clips:[{id:'a',in:0,out:50}]});sel={kind:'clip',id:'a'};nudgeClip('out',-1);doUndo();nudgeClip('in',-1)");return eq(k("redo.length"),1)});
  T("備註裡的分號不會被當成掉格",()=>{const r=k(`parseEDL('FCM: NON-DROP FRAME\\n001 AX V C 00:00:00:00 00:00:01:00 01:00:00:00 01:00:01:00\\n* COMMENT: take 1;23\\n',30).clips.length`);return r===1||r});
  T("FCM 前有空白也會辨識",()=>{const r=k(`parseEDL(' FCM: DROP FRAME\\n001 AX V C 01:00:00:00 01:00:01:00 01:00:00:00 01:00:01:00\\n',29.97).clips[0].in`);return r===107892||r});
  T("不存在的掉格標號會被略過並警告",()=>{const r=k(`parseEDL('001 AX V C 00:01:00;00 00:01:01;00 01:00:00;00 01:00:01;00\\n002 AX V C 00:02:00;02 00:02:01;02 01:00:01;00 01:00:02;00\\n',29.97)`);return (r.clips.length===1&&String(r.warn).includes("不合法"))||r});
  T("EDL 保留檔名中的連續空白",()=>{k("load({clips:[{id:'a',src:'take  01.mov',out:9}]})");return k("buildEDL()").includes("take  01.mov")||"collapsed"});
  T("文字格數會被拒絕",()=>{try{k("normalize({clips:[{in:'abc',out:9}]})");return "accepted"}catch(e){return true}});
  T("還原時主草稿寫入失敗：備份仍在，畫面不變",()=>{reset();k("sel={kind:'clip',id:'c1'};nudgeClip('out',-1);loadNew({clips:[{id:'z',out:9}]});window.__set=store.set;store.set=(v,key=KEY)=>key===KEY?false:window.__set(v,key);restorePrev();store.set=window.__set");
    return (k("doc.clips[0].id")==="z"&&k("prevDrafts.length")===1&&k("prevDrafts[0].doc.clips[0].out")===116)||k("[doc.clips[0].id,prevDrafts.length]")});
  T("標記到上限後不能再新增",()=>{k("load({clips:[{id:'a',out:50}],markers:Array.from({length:20000},(_,i)=>({id:'m'+i,clip:'a',at:0}))});addMarker()");return eq(k("doc.markers.length"),20000)});
  T("讀不到又備份不了的草稿不會被範例覆寫",()=>{k("saveBlocked=true;window.__n=0;window.__set=store.set;store.set=(v,key)=>{window.__n++;return true};load(SAMPLE);store.set=window.__set;saveBlocked=false");return eq(k("window.__n"),0)});
  T("影片校準期間不做任何定位",()=>{k("load(SAMPLE);videoURL='x';window.__c=video.currentTime;calibrating={};playhead=100;updatePreview(layout(doc));calibrating=null;videoURL=null");return eq(k("video.currentTime"),k("window.__c"))});
  T("手動清單先延長再裁切，每步都做得到",()=>{k("load({clips:[{id:'a',in:100,out:200}]});doc.clips[0].in=0;doc.clips[0].out=50");const x=k("buildManual()");
    return (x.indexOf("開頭延長 100 格")>0&&x.indexOf("開頭延長 100 格")<x.indexOf("結尾裁掉 150 格"))||x});
  T("有損匯入先詢問，取消就不改時間軸",()=>{reset();const edl="001 AX V C 00:00:00:00 00:00:01:00 01:00:00:00 01:00:01:00\\n002 AX V C 00:00:00:00 00:00:01:00 01:00:02:00 01:00:03:00\\n";
    const m=k(`importText('${edl}','a.edl')`);const a=k("doc.clips.length");k("settleImport(false)");const b=k("doc.clips.length");
    k(`importText('${edl}','a.edl');settleImport(true)`);return (m.includes("尚未載入")&&a===6&&b===6&&k("doc.clips.length")===2)||{m,a,b}});
  T("FCPXML 位置不連續會警告",()=>{const x=k(`parseFCPXML('<fcpxml version="1.9"><resources><format id="r1" frameDuration="1/30s"/><asset id="r2" name="a"/></resources><library><event><project name="p"><sequence format="r1"><spine><asset-clip ref="r2" offset="0s" start="0s" duration="1s"/><asset-clip ref="r2" offset="5s" start="0s" duration="1s"/></spine></sequence></project></event></library></fcpxml>').warn`);return String(x).includes("不連續")||x});
  T("手動清單給實際下刀的四段時間碼",()=>{reset();k("sel={kind:'clip',id:'c1'};nudgeClip('out',-10)");const x=k("buildManual()");return x.includes("在 00:00:02:02 切一刀，刪到 00:00:02:12")||x});
  T("手動清單的延長會提醒需要原始素材",()=>{reset();k("sel={kind:'clip',id:'c1'};nudgeClip('in',-4)");const x=k("buildManual()");return (x.includes("開頭延長 4 格（需要原始素材）")&&x.includes("請改請 Claude"))||x});
  T("只有裁切時不出現原始素材提醒",()=>{reset();k("sel={kind:'clip',id:'c1'};nudgeClip('in',4)");return !k("buildManual()").includes("需要原始素材")||"shown"});
  T("保護舊草稿期間不能用還原覆寫它",()=>{reset();k("sel={kind:'clip',id:'c1'};nudgeClip('out',-1);loadNew({clips:[{id:'z',out:9}]});saveBlocked=true;window.__n=0;window.__set=store.set;store.set=(v,key=KEY)=>{if(key===KEY)window.__n++;return true};restorePrev();store.set=window.__set;saveBlocked=false");
    return (k("window.__n")===0&&k("doc.clips[0].id")==="z"&&k("prevDrafts.length")===1)||k("[window.__n,doc.clips[0].id]")});
  T("?test 不寫入瀏覽器儲存",()=>eq(k("store.get()"),null));

  /* phone layout runs in a real 390-wide viewport */
  const pf=document.getElementById("phone");
  if(!pf.contentDocument||pf.contentDocument.readyState!=="complete")await new Promise(r=>pf.addEventListener("load",r,{once:true}));
  await new Promise(r=>setTimeout(r,50));
  const pw=pf.contentWindow,p=c=>pw.eval(c),pd=pf.contentDocument,tick=()=>new Promise(r=>setTimeout(r,60));
  const size=async(w,h)=>{pf.width=w;pf.height=h;await tick()};
  const preset=()=>p("sel=null;load(SAMPLE);renderInspector();renderTimeline();closeSheet();seek(0)");
  /* everything needed to edit has to be on screen at once */
  const onScreen=(sels)=>{const bad=[],H=pw.innerHeight;if(pd.documentElement.scrollHeight>H)bad.push("page scrolls");
    if(pd.querySelector(".app").scrollHeight>pd.querySelector(".app").clientHeight+1)bad.push("app overflows");
    for(const q of sels){const e=pd.querySelector(q),b=e&&e.getBoundingClientRect();if(!b||!b.height||b.top<0||b.bottom>H+.5||b.left<-.5||b.right>pw.innerWidth+.5)bad.push(q)}
    const pv=pd.querySelector(".preview").getBoundingClientRect().height;if(pv<96)bad.push("preview "+pv);return bad.length?bad:true};
  const BASE=["#frame",".transport",".tl",".tools"];
  for(const [w,h] of [[320,568],[375,667],[390,700],[430,932]]){await size(w,h);preset();
    T(`${w}×${h} 預覽、播放、時間軸、工具同屏`,()=>onScreen(BASE));
    p("sel={kind:'clip',id:'c2'};renderTimeline();renderInspector()");await tick();
    T(`${w}×${h} 修剪時微調面板同屏`,()=>onScreen([...BASE,".nudge[data-k=in] .nb",".insp .acts"]));
    p("addMarker()");await tick();
    T(`${w}×${h} 特效面板同屏`,()=>onScreen([...BASE,".fxgrid",".insp .acts"]))}
  await size(390,700);preset();await tick();
  T("主要按鈕觸控區夠大",()=>{p("sel={kind:'clip',id:'c2'};renderTimeline();renderInspector()");const bad=[...pd.querySelectorAll(".transport .ib,.nudge[data-k=in] .nb,.tools button")].filter(b=>{const r=b.getBoundingClientRect();return r.height<44||r.width<38}).map(b=>b.outerHTML.slice(0,50));return bad.length?bad:true});
  await tick();
  T("選取鏡頭的把手觸區至少 44 寬",()=>{const r=pd.querySelector(".clip.sel .h.r").getBoundingClientRect();return r.width>=44||r.width});
  T("未選取鏡頭沒有把手，滑動不會誤修剪",()=>{const h=pd.querySelector(".clip:not(.sel) .h");return pw.getComputedStyle(h).display==="none"||"shown"});
  preset();await tick();
  p("scroll.scrollLeft=300");pd.getElementById("scroll").dispatchEvent(new pw.Event("scroll"));
  T("捲動 300px 對應第 100 格",()=>eq(p("playhead"),100));
  p("seek(50)");await tick();
  T("程式移動播放頭後不被捲動事件改寫",()=>eq([p("playhead"),p("scroll.scrollLeft")],[50,150]));
  p("ppf=.25;renderTimeline();seek(51)");await tick();
  T("低縮放下逐格不被像素取整吃掉",()=>eq(p("playhead"),51));
  preset();p("ppf=3;renderTimeline()");await tick();
  const clipEl=id=>pd.querySelector(`.clip[data-id="${id}"]`);
  clipEl("c1").click();
  T("點鏡頭選取且不動播放頭",()=>eq([p("sel&&sel.id"),p("playhead")],["c1",0]));
  await tick();
  T("點畫面外的鏡頭，預覽跟到該鏡頭",()=>{p("nudgeEdge='in';sel=null;renderInspector();renderTimeline();seek(0)");clipEl("c3").click();const r=[p("sel.id"),p("playhead")===p("layout(doc).map.c3.start")];p("sel={kind:'clip',id:'c1'};renderTimeline();renderInspector();seek(0)");return eq(r,["c3",true])});
  await tick();
  const fire=(el,t,x,id=1)=>el.dispatchEvent(new pw.PointerEvent(t,{bubbles:true,cancelable:true,clientX:x,clientY:300,pointerId:id,isPrimary:true}));
  const out0=p("doc.clips[0].out"),h=pd.querySelector(".clip.sel .h.r");
  fire(h,"pointerdown",200);fire(pw,"pointermove",230);
  T("拖把手時時間軸凍結",()=>eq(p("tlFreeze"),true));
  fire(pw,"pointermove",230,2);
  T("第二指不影響修剪",()=>eq(p("doc.clips[0].out"),out0+10));
  fire(pw,"pointercancel",230);
  T("手勢被取消時還原修剪",()=>eq([p("doc.clips[0].out"),p("undo.length"),p("tlFreeze")],[out0,0,false]));
  fire(pd.querySelector(".clip.sel .h.r"),"pointerdown",200);fire(pw,"pointermove",215);fire(pw,"pointerup",215);
  T("放開後修剪生效且可復原",()=>{const a=p("doc.clips[0].out");p("doUndo()");return eq([a,p("doc.clips[0].out")],[out0+5,out0])});
  preset();await tick();
  T("標題是 KOMA 影格",()=>eq(pd.querySelector(".brand h1").textContent+pd.querySelector(".brand p").textContent,"KOMA 影格(editor for claude video)"));
  T("手機與桌面都是淺色底",()=>{const c=pw.getComputedStyle(pd.body).backgroundColor.match(/\d+/g).map(Number);return Math.min(...c.slice(0,3))>220||c});
  preset();await tick();
  pd.querySelector('.tools [data-t="caption"]').click();
  T("按字幕工具直接開始打字",()=>eq([p("fxOf(doc.markers.find(m=>m.id===sel.id).type).l"),pd.activeElement.id,pd.getElementById("insp").classList.contains("noting")],["字卡 / 字幕","mkNote",true]));
  const ta=()=>pd.getElementById("mkNote");
  ta().value="第一句";ta().dispatchEvent(new pw.Event("input",{bubbles:true}));
  T("打字時預覽與時間軸即時顯示字幕",()=>eq([pd.getElementById("capOv").textContent,pd.getElementById("capOv").hidden,pd.querySelector(".mk.sel span").textContent],["第一句",false,"第一句"]));
  T("字幕內容進到給 Claude 的清單",()=>p("logText()").includes("第一句")||p("logText()"));
  pd.querySelector('#insp [data-a="close"]').click();await tick();
  await new Promise(r=>setTimeout(r,450));
  T("完成後收起面板",()=>eq(p("sel"),null));
  const cid=p("doc.markers[doc.markers.length-1].id");
  pd.querySelector(`.mk[data-id="${cid}"]`).click();
  T("點時間軸字幕直接跳出編輯",()=>eq([p("sel.id"),pd.activeElement.id,pd.getElementById("insp").classList.contains("noting")],[cid,"mkNote",true]));
  ta().value="第一句改";ta().dispatchEvent(new pw.Event("input",{bubbles:true}));
  pd.querySelector('#insp [data-a="cancelnote"]').click();await tick();
  T("取消會還原字幕",()=>eq(p(`doc.markers.find(m=>m.id==="${cid}").note`),"第一句"));
  p("sel=null;renderInspector();renderTimeline()");await tick();
  pd.getElementById("capOv").click();
  T("點畫面上的字幕也能編輯",()=>eq([p("sel&&sel.id"),pd.activeElement.id,p("playing")],[cid,"mkNote",false]));
  T("字幕編輯時面板在畫面內",()=>onScreen(["#mkNote",".insp .acts"]));
  pd.querySelector('#insp [data-a="dur:1"]').click();
  T("調整字幕時間不關閉鍵盤",()=>eq([pd.activeElement.id,p(`doc.markers.find(m=>m.id==="${cid}").dur`)],["mkNote",75]));
  T("SRT 用字幕文字與起訖時間",()=>{const x=p("buildSRT()");return (x.startsWith("1\n")&&x.includes("第一句")&&/\d\d:\d\d:\d\d,\d{3} --> /.test(x))||x});
  T("字幕時間存進時間軸並能重開",()=>eq(p(`normalize(exportDoc()).markers.find(m=>m.id==="${cid}").dur`),75));
  T("不合理的字幕時間會被略過",()=>eq(p("normalize({clips:[{id:'a',out:9}],markers:[{clip:'a',at:0,type:'text',dur:-5}]}).markers[0].dur===undefined"),true));
  p("document.activeElement.blur()");
  preset();await tick();
  T("打開抽屜不會推動畫面",()=>{p("openSheet('out')");const a=pd.querySelector(".app"),r=[a.scrollTop,pd.body.scrollTop,pd.documentElement.scrollTop];p("closeSheet()");return eq(r,[0,0,0])});
  T("抽屜開啟時背景不可操作，快捷鍵不會改到時間軸",()=>{p("sel=null;addMarker();openSheet('out')");const n=p("doc.markers.length");pd.getElementById("sheetClose").dispatchEvent(new pw.KeyboardEvent("keydown",{key:"Delete",bubbles:true}));const r=[p("doc.markers.length")===n,pd.querySelector(".tl").inert];p("closeSheet()");return eq([...r,pd.querySelector(".tl").inert],[true,true,false])});
  preset();await tick();
  T("還原上一份草稿的按鈕完整顯示",()=>{p("sel={kind:'clip',id:'c1'};nudgeClip('out',-1);loadNew({clips:[{id:'z',out:9}]})");const b=pd.getElementById("restorePrev"),r=b.getBoundingClientRect(),ok=!b.hidden&&r.left>=0&&r.right<=pw.innerWidth&&r.width>100;p("prevDrafts=[];savePrevs()");return ok||[b.hidden,r.left,r.right]});
  await size(740,360);preset();await tick();
  T("手機橫向也不用捲動",()=>onScreen(BASE));
  p("nudgeEdge='in';sel={kind:'clip',id:'c2'};renderTimeline();renderInspector()");await tick();
  T("手機橫向修剪面板同屏",()=>onScreen([".transport",".tl",".nudge[data-k=in] .nb"]));

  reset();
  const fail=results.filter(r=>!r.ok);
  document.getElementById("sum").textContent=`${results.length-fail.length} / ${results.length} 通過`;
  document.getElementById("sum").className=fail.length?"fail":"pass";
  document.getElementById("out").innerHTML=results.map(r=>`<span class="${r.ok?"pass":"fail"}">${r.ok?"✓":"✗"} ${r.name.replace(/</g,"&lt;")}${r.ok?"":"\n    "+r.info.replace(/</g,"&lt;")}</span>`).join("\n");
  window.koma={passed:results.length-fail.length,total:results.length,fail};
};
</script>
</body>
</html>
